# Portal dev stack: Postgres + MinIO, plus the engine (phase 4); phase 10 adds
# the portal API and worker containers.
#   docker compose -f docker/docker-compose.portal.yml up -d
#   docker compose -f docker/docker-compose.portal.yml --profile cpu up engine
#   docker compose -f docker/docker-compose.portal.yml --profile gpu up engine-gpu
#
# `name:` keeps this stack's compose project separate from the sibling
# docker-compose.yml (both live under docker/, which would otherwise make
# them share the default "docker" project name, network and orphan-pruning).
name: vieneu-portal

services:
  postgres:
    image: postgres:16
    container_name: vieneu-portal-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-vieneu}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-vieneu}
      - POSTGRES_DB=${POSTGRES_DB:-vieneu_portal}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vieneu_portal_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vieneu} -d ${POSTGRES_DB:-vieneu_portal}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: vieneu-portal-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-vieneu}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-vieneu_minio_password}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - vieneu_portal_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-bucket-init:
    image: minio/mc:latest
    container_name: vieneu-portal-minio-bucket-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-vieneu}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-vieneu_minio_password}
      - S3_BUCKET=${S3_BUCKET:-vieneu-portal}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb -p local/$$S3_BUCKET &&
      exit 0
      "
    restart: "no"

  # Speech engine (apps/openai_speech.py), service-key auth only, no admin app,
  # no published port: only other containers on this compose's default network
  # (e.g. the portal API, phase 10) can reach it, at http://engine:8000 or
  # http://engine-gpu:8000. `${VIENEU_ENGINE_SERVICE_KEY:?...}` fails the whole
  # `up` instead of silently starting an unauthenticated engine.
  engine:
    profiles: ["cpu"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.cpu
    container_name: vieneu-portal-engine
    command: ["python", "-m", "apps.openai_speech"]
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - PYTHONUNBUFFERED=1
      - HF_HOME=${HF_HOME:-/home/app/.cache/huggingface}
      - VIENEU_API_KEY=${VIENEU_ENGINE_SERVICE_KEY:?set VIENEU_ENGINE_SERVICE_KEY}
      - VIENEU_BACKEND=onnx
      - VIENEU_PRECISION=${VIENEU_PRECISION:-fp32}
      - VIENEU_MAX_STREAMS=${VIENEU_ENGINE_MAX_STREAMS:-1}
      - VIENEU_QUEUE=${VIENEU_ENGINE_QUEUE:-4}
      - VIENEU_QUEUE_TIMEOUT=${VIENEU_ENGINE_QUEUE_TIMEOUT:-10}
      - VIENEU_WATERMARK=${VIENEU_WATERMARK:-1}
    volumes:
      - vieneu_portal_engine_hf_cache:/home/app/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 180s
      retries: 3
    restart: unless-stopped

  engine-gpu:
    profiles: ["gpu"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.gpu
      target: prod
    container_name: vieneu-portal-engine-gpu
    command: ["python", "-m", "apps.openai_speech"]
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - PYTHONUNBUFFERED=1
      - HF_HOME=${HF_HOME:-/home/app/.cache/huggingface}
      - VIENEU_API_KEY=${VIENEU_ENGINE_SERVICE_KEY:?set VIENEU_ENGINE_SERVICE_KEY}
      - VIENEU_MAX_STREAMS=${VIENEU_ENGINE_MAX_STREAMS:-16}
      - VIENEU_QUEUE=${VIENEU_ENGINE_QUEUE:-16}
      - VIENEU_QUEUE_TIMEOUT=${VIENEU_ENGINE_QUEUE_TIMEOUT:-10}
      - VIENEU_WATERMARK=${VIENEU_WATERMARK:-1}
    volumes:
      - vieneu_portal_engine_hf_cache:/home/app/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # Portal API: runs migrations then serves /api/v1 on the published port.
  # No GPU/engine deps in this image — see docker/Dockerfile.portal.
  portal:
    build:
      context: ..
      dockerfile: docker/Dockerfile.portal
    container_name: vieneu-portal-api
    depends_on:
      postgres:
        condition: service_healthy
      minio-bucket-init:
        condition: service_completed_successfully
    command: ["sh", "-c", "python -m vieneu_portal db upgrade && python -m vieneu_portal serve"]
    environment:
      - HOST=0.0.0.0
      - PORT=8100
      - VIENEU_PORTAL_SECRET_KEY=${VIENEU_PORTAL_SECRET_KEY:?set VIENEU_PORTAL_SECRET_KEY}
      - VIENEU_PORTAL_DATABASE_URL=postgresql://${POSTGRES_USER:-vieneu}:${POSTGRES_PASSWORD:-vieneu}@postgres:5432/${POSTGRES_DB:-vieneu_portal}
      - VIENEU_PORTAL_S3_ENDPOINT=http://minio:9000
      - VIENEU_PORTAL_S3_PUBLIC_ENDPOINT=${VIENEU_PORTAL_S3_PUBLIC_ENDPOINT:-http://localhost:${MINIO_PORT:-9000}}
      - VIENEU_PORTAL_S3_BUCKET=${S3_BUCKET:-vieneu-portal}
      - VIENEU_PORTAL_S3_ACCESS_KEY=${MINIO_ROOT_USER:-vieneu}
      - VIENEU_PORTAL_S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-vieneu_minio_password}
      - VIENEU_PORTAL_ENGINE_URL=${VIENEU_PORTAL_ENGINE_URL:-http://engine:8000}
      - VIENEU_PORTAL_ENGINE_SERVICE_KEY=${VIENEU_ENGINE_SERVICE_KEY:?set VIENEU_ENGINE_SERVICE_KEY}
      - VIENEU_PORTAL_SIGNUP_ENABLED=${VIENEU_PORTAL_SIGNUP_ENABLED:-true}
    ports:
      - "${PORTAL_PORT:-8100}:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/api/v1/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  # Same image as `portal`; claims ASYNC PENDING recordings instead of
  # serving HTTP. One worker by default (per-user lease already bounds one
  # account to one in-flight synthesis, so a single worker is not a
  # starvation risk by itself).
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.portal
    container_name: vieneu-portal-worker
    depends_on:
      postgres:
        condition: service_healthy
      portal:
        condition: service_healthy
    command: ["python", "-m", "vieneu_portal", "worker"]
    environment:
      - VIENEU_PORTAL_SECRET_KEY=${VIENEU_PORTAL_SECRET_KEY:?set VIENEU_PORTAL_SECRET_KEY}
      - VIENEU_PORTAL_DATABASE_URL=postgresql://${POSTGRES_USER:-vieneu}:${POSTGRES_PASSWORD:-vieneu}@postgres:5432/${POSTGRES_DB:-vieneu_portal}
      - VIENEU_PORTAL_S3_ENDPOINT=http://minio:9000
      - VIENEU_PORTAL_S3_PUBLIC_ENDPOINT=${VIENEU_PORTAL_S3_PUBLIC_ENDPOINT:-http://localhost:${MINIO_PORT:-9000}}
      - VIENEU_PORTAL_S3_BUCKET=${S3_BUCKET:-vieneu-portal}
      - VIENEU_PORTAL_S3_ACCESS_KEY=${MINIO_ROOT_USER:-vieneu}
      - VIENEU_PORTAL_S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-vieneu_minio_password}
      - VIENEU_PORTAL_ENGINE_URL=${VIENEU_PORTAL_ENGINE_URL:-http://engine:8000}
      - VIENEU_PORTAL_ENGINE_SERVICE_KEY=${VIENEU_ENGINE_SERVICE_KEY:?set VIENEU_ENGINE_SERVICE_KEY}
    restart: unless-stopped

volumes:
  vieneu_portal_postgres:
  vieneu_portal_minio:
  vieneu_portal_engine_hf_cache:
