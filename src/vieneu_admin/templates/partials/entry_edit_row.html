<tr id="entry-{{ entry.id }}" class="editing">
  <td><input name="term" value="{{ entry.term }}" maxlength="80" required aria-label="Term"></td>
  <td><input name="replacement" value="{{ entry.replacement }}" maxlength="200" aria-label="Replacement">
    {% if error %}<div class="alert error small" role="alert">{{ error }}</div>{% endif %}</td>
  <td><select name="mode" aria-label="Mode">{% for m in ['phonetic', 'en'] %}<option value="{{ m }}" {% if entry.mode == m %}selected{% endif %}>{{ m }}</option>{% endfor %}</select></td>
  <td><input type="checkbox" name="case_sensitive" value="1" {% if entry.case_sensitive %}checked{% endif %} aria-label="Case-sensitive"></td>
  <td><input name="note" value="{{ entry.note }}" aria-label="Note"></td>
  <td class="actions">
    <button type="button" hx-post="{{ u('admin_entry_save', dictionary_id=dictionary_id, entry_id=entry.id) }}"
            hx-include="closest tr" hx-target="closest tr" hx-swap="outerHTML">Save</button>
    <button type="button" class="secondary" hx-get="{{ u('admin_entry_row', dictionary_id=dictionary_id, entry_id=entry.id) }}"
            hx-target="closest tr" hx-swap="outerHTML">Cancel</button>
  </td>
</tr>
